name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp adhan*.mp3 www/ 2>/dev/null || true
          curl -sSfL https://api.alquran.cloud/v1/quran/quran-uthmani -o www/quran.json || echo "online fallback"
          curl -sSfL https://raw.githubusercontent.com/google/fonts/main/ofl/amiriquran/AmiriQuran-Regular.ttf -o www/quran_amiri.ttf || echo "amiri quran not downloaded"
          cp www/quran_amiri.ttf www/quran.ttf 2>/dev/null || true
          curl -sSfL https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Regular.ttf -o www/quran_sch.ttf || echo "scheherazade not downloaded"
          curl -sSfL https://api.alquran.cloud/v1/quran/quran-simple -o www/quran_simple.json || echo "no simple text"
          curl -sSfL https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-nawawi.min.json -o www/nawawi.json || curl -sSfL https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-nawawi.json -o www/nawawi.json || echo "no nawawi"
          cp quran_user.* www/ 2>/dev/null || true
          curl -sSfL https://quranenc.com/downloads/assets/Hafs_20.zip -o hafs.zip && unzip -o -q hafs.zip -d hafs || echo "hafs zip failed"
          python3 - <<'PY'
          import csv,json,glob,shutil
          try:
              ttf=glob.glob('hafs/**/*.ttf',recursive=True)
              cs=glob.glob('hafs/**/*.csv',recursive=True)
              d=json.load(open('www/quran.json',encoding='utf-8'))
              m={}
              for r in csv.DictReader(open(cs[0],encoding='utf-8-sig')):
                  r={k.strip().strip('"'):v for k,v in r.items()}
                  m[(int(r['sura']),int(r['aya']))]=r['uthmani'].strip()
              assert len(m)==6236 and ttf
              bs=m[(1,1)]
              for s in d['data']['surahs']:
                  for a in s['ayahs']:
                      t=m[(s['number'],a['numberInSurah'])]
                      if a['numberInSurah']==1 and s['number'] not in (1,9):
                          t=bs+' '+t
                      a['text']=t
              d['src']='مجمع الملك فهد (خط وبيانات Hafs v20) عبر QuranEnc.com'
              json.dump(d,open('www/quran.json','w',encoding='utf-8'),ensure_ascii=False)
              shutil.copy(ttf[0],'www/quran.ttf')
              print('hafs merged')
          except Exception as e:
              print('hafs merge skipped:',e)
          PY
          curl -sSfL https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf -o www/ruqaa.ttf || curl -sSfL https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Regular.ttf -o www/ruqaa.ttf || echo "ruqaa font not downloaded"
          curl -sSfL https://api.alquran.cloud/v1/quran/ar.muyassar -o www/tafsir_muyassar.json || echo "no muyassar"
          curl -sSfL https://api.alquran.cloud/v1/quran/ar.jalalayn -o www/tafsir_jalalayn.json || echo "no jalalayn"
          cp icon.png www/splash.png 2>/dev/null || true
          cp salawat*.mp3 www/ 2>/dev/null || true
      - run: npx cap add android
      - name: Exact alarm permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Copy adhan sounds
        run: |
          mkdir -p android/app/src/main/res/raw
          cp adhan*.mp3 android/app/src/main/res/raw/ 2>/dev/null || true
          cp salawat*.mp3 android/app/src/main/res/raw/ 2>/dev/null || true
      - name: Notification icons
        run: |
          mkdir -p android/app/src/main/res/drawable
          pip install pillow
          python3 -c "from PIL import Image,ImageDraw; im=Image.new('RGBA',(96,96),(0,0,0,0)); d=ImageDraw.Draw(im); d.ellipse((12,12,84,84),fill='white'); d.ellipse((32,4,96,68),fill=(0,0,0,0)); d.ellipse((62,30,76,44),fill='white'); im.save('android/app/src/main/res/drawable/ic_stat_rafiqi.png')"
          if [ -f icon.png ]; then python3 -c "from PIL import Image; Image.open('icon.png').convert('RGBA').resize((192,192)).save('android/app/src/main/res/drawable/ic_large.png')"; fi
      - name: Apply app icon
        run: |
          if [ -f icon.png ]; then
            pip install pillow
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            python3 -c "from PIL import Image; im=Image.open('icon.png').convert('RGBA'); [im.resize((s,s)).save('android/app/src/main/res/mipmap-%s/%s' % (d,n)) for d,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items() for n in ('ic_launcher.png','ic_launcher_round.png')]"
          fi
      - run: npx cap sync android
      - name: Sign with fixed key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /home/runner/rafiqi.p12
            sed -i 's#^android {#android {\n    signingConfigs {\n        release {\n            storeFile file("/home/runner/rafiqi.p12")\n            storePassword "rafiqi123"\n            keyAlias "rafiqi"\n            keyPassword "rafiqi123"\n            storeType "pkcs12"\n        }\n    }#' android/app/build.gradle
            sed -i 's#buildTypes {#buildTypes {\n        debug {\n            signingConfig signingConfigs.release\n        }#' android/app/build.gradle
          else
            echo "No signing secret, using default debug key"
          fi
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rafiqi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rafiqi.apk
          gh release create "v${{ github.run_number }}" rafiqi.apk --title "رفيقي v${{ github.run_number }}" --notes "تطبيق رفيقي - رفيقك في طريق الخير" --latest
