name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp adhan*.mp3 www/ 2>/dev/null || true
      - run: npx cap add android
      - name: Copy adhan sounds for notifications
        run: |
          mkdir -p android/app/src/main/res/raw
          cp adhan*.mp3 android/app/src/main/res/raw/ 2>/dev/null || true
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rafiqi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
